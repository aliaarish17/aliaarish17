<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="850" height="220" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="850" height="220" rx="14" fill="url(#bg)"/>

  <!-- Subtle arc lines for depth -->
  <g clip-path="url(#clip)" opacity="0.5">
    <ellipse cx="820" cy="110" rx="220" ry="180" fill="none" stroke="#334155" stroke-width="1"/>
    <ellipse cx="820" cy="110" rx="160" ry="130" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <ellipse cx="820" cy="110" rx="100" ry="80" fill="none" stroke="#1E293B" stroke-width="1"/>
    <line x1="650" y1="0" x2="850" y2="220" stroke="#1E293B" stroke-width="0.8"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="220" rx="2" fill="url(#lineAccent)"/>

  <!-- Main text block -->
  <g transform="translate(48, 58)">
    <!-- Subtle label -->
    <text font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#475569" letter-spacing="3">FULL STACK DEVELOPER</text>

    <!-- Name -->
    <text font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#nameGrad)" letter-spacing="2" y="62">AARISH</text>

    <!-- Underline accent -->
    <rect y="72" width="220" height="2" rx="1" fill="url(#lineAccent)" opacity="0.8"/>

    <!-- Subtitle line -->
    <text font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="13" fill="#64748B" letter-spacing="1" y="100">AI + JavaScript • React • Node.js • Python</text>
    <text font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" fill="#475569" letter-spacing="0.5" y="122">Pre-Final Year CS Undergrad @ NSU</text>
  </g>

  <!-- Right: Code snippet decoration -->
  <g transform="translate(540, 55)" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="13">
    <text fill="#475569" y="0">const dev = {</text>
    <text fill="#64748B" y="22">  name: <tspan fill="#38BDF8">"Aarish"</tspan>,</text>
    <text fill="#64748B" y="44">  focus: <tspan fill="#818CF8">"AI + Web"</tspan>,</text>
    <text fill="#64748B" y="66">  mode: <tspan fill="#34D399">"BUILD→SHIP"</tspan></text>
    <text fill="#475569" y="88">}</text>
  </g>
</svg>
