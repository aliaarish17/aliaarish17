<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1E293B"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
    .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="850" height="280" rx="14" fill="url(#bg)"/>
  <rect width="850" height="280" rx="14" fill="url(#dots)"/>
  <!-- Border -->
  <rect width="850" height="280" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left accent -->
  <rect x="0" y="0" width="3" height="280" rx="2" fill="url(#lineGrad)"/>

  <!-- Header row -->
  <g transform="translate(25, 28)">
    <text class="mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2">DEVELOPER TELEMETRY</text>
    <text class="mono" font-size="10" fill="#334155" x="790" text-anchor="end">MAX STREAK ↗</text>
    <line x1="0" y1="14" x2="790" y2="14" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- MAX STREAK BOX -->
  <g transform="translate(582, 20)">
    <rect width="240" height="64" rx="10" fill="#0F172A" stroke="url(#streakGrad)" stroke-width="1.5"/>
    <text class="mono" font-size="10" font-weight="700" fill="#94A3B8" x="16" y="22">[ MAX STREAK RECORD ]</text>
    <text class="sans" font-size="30" font-weight="900" fill="url(#streakGrad)" x="16" y="54">34 DAYS 🔥</text>
  </g>

  <!-- Graph area (left) -->
  <g transform="translate(25, 100)">
    <!-- Grid -->
    <line x1="35" y1="0"   x2="520" y2="0"   stroke="#1E293B" stroke-dasharray="3 4"/>
    <line x1="35" y1="38"  x2="520" y2="38"  stroke="#1E293B" stroke-dasharray="3 4"/>
    <line x1="35" y1="76"  x2="520" y2="76"  stroke="#1E293B" stroke-dasharray="3 4"/>
    <line x1="35" y1="114" x2="520" y2="114" stroke="#334155" stroke-width="1"/>

    <!-- Y labels -->
    <text class="mono" font-size="9" fill="#475569" x="28" y="4"   text-anchor="end">MAX</text>
    <text class="mono" font-size="9" fill="#475569" x="28" y="42"  text-anchor="end">MED</text>
    <text class="mono" font-size="9" fill="#475569" x="28" y="80"  text-anchor="end">LOW</text>
    <text class="mono" font-size="9" fill="#475569" x="28" y="118" text-anchor="end">0</text>

    <!-- Area fill -->
    <path d="M35,96 C100,55 155,78 230,18 C305,58 375,22 460,8 L460,114 L35,114 Z" fill="url(#areaGrad)"/>
    <!-- Curve -->
    <path d="M35,96 C100,55 155,78 230,18 C305,58 375,22 460,8" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="35"  cy="96" r="3.5" fill="#38BDF8" stroke="#080D1A" stroke-width="2"/>
    <circle cx="115" cy="60" r="3.5" fill="#38BDF8" stroke="#080D1A" stroke-width="2"/>
    <circle cx="192" cy="48" r="3.5" fill="#818CF8" stroke="#080D1A" stroke-width="2"/>
    <circle cx="270" cy="22" r="3.5" fill="#818CF8" stroke="#080D1A" stroke-width="2"/>
    <circle cx="345" cy="38" r="3.5" fill="#34D399" stroke="#080D1A" stroke-width="2"/>
    <circle cx="415" cy="18" r="3.5" fill="#34D399" stroke="#080D1A" stroke-width="2"/>
    <circle cx="460" cy="8"  r="3.5" fill="#34D399" stroke="#080D1A" stroke-width="2"/>

    <!-- X labels -->
    <text class="mono" font-size="9" fill="#475569" x="35"  y="132" text-anchor="middle">MON</text>
    <text class="mono" font-size="9" fill="#475569" x="115" y="132" text-anchor="middle">TUE</text>
    <text class="mono" font-size="9" fill="#475569" x="192" y="132" text-anchor="middle">WED</text>
    <text class="mono" font-size="9" fill="#475569" x="270" y="132" text-anchor="middle">THU</text>
    <text class="mono" font-size="9" fill="#475569" x="345" y="132" text-anchor="middle">FRI</text>
    <text class="mono" font-size="9" fill="#475569" x="415" y="132" text-anchor="middle">SAT</text>
    <text class="mono" font-size="9" fill="#475569" x="460" y="132" text-anchor="middle">SUN</text>
  </g>

  <!-- Stack distribution (right) -->
  <g transform="translate(582, 105)">
    <text class="mono" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">[ STACK DISTRIBUTION ]</text>

    <!-- JS/TS -->
    <g transform="translate(0,22)">
      <text class="mono" font-size="10" font-weight="700" fill="#E2E8F0" y="12">JAVASCRIPT / TYPESCRIPT</text>
      <text class="mono" font-size="10" fill="#38BDF8" x="240" y="12" text-anchor="end">65%</text>
      <rect y="18" width="240" height="5" rx="2.5" fill="#1E293B"/>
      <rect y="18" width="156" height="5" rx="2.5" fill="url(#lineGrad)"/>
    </g>

    <!-- Python -->
    <g transform="translate(0,52)">
      <text class="mono" font-size="10" font-weight="700" fill="#E2E8F0" y="12">PYTHON / FASTAPI / AI</text>
      <text class="mono" font-size="10" fill="#818CF8" x="240" y="12" text-anchor="end">20%</text>
      <rect y="18" width="240" height="5" rx="2.5" fill="#1E293B"/>
      <rect y="18" width="48" height="5" rx="2.5" fill="#818CF8"/>
    </g>

    <!-- React -->
    <g transform="translate(0,82)">
      <text class="mono" font-size="10" font-weight="700" fill="#E2E8F0" y="12">REACT.JS / NEXT.JS</text>
      <text class="mono" font-size="10" fill="#34D399" x="240" y="12" text-anchor="end">15%</text>
      <rect y="18" width="240" height="5" rx="2.5" fill="#1E293B"/>
      <rect y="18" width="36" height="5" rx="2.5" fill="#34D399"/>
    </g>
  </g>

  <!-- Footer bar -->
  <g transform="translate(25, 256)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text class="mono" font-size="9" fill="#334155" y="16">TARGET: FULL-STACK AI PRODUCTS</text>
    <text class="mono" font-size="9" fill="#334155" x="400" y="16" text-anchor="middle">METHOD: BUILD → DEBUG → SHIP</text>
    <text class="mono" font-size="9" fill="#38BDF8" x="800" y="16" text-anchor="end">STATUS: ACTIVE ●</text>
  </g>
</svg>
